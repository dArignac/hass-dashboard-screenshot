name: Dependabot Auto-Merge and Assignee

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  dependabot:
    name: Handle Dependabot PR
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Auto-approve and enable auto-merge for non-major updates
        if: steps.metadata.outputs.dependency-group == 'non-major' || (steps.metadata.outputs.update-type != 'version-update:semver-major' && steps.metadata.outputs.update-type != '')
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Assign major updates to @dArignac
        if: steps.metadata.outputs.update-type == 'version-update:semver-major' && steps.metadata.outputs.dependency-group != 'non-major'
        run: |
          gh pr edit "$PR_URL" --add-assignee "dArignac"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
